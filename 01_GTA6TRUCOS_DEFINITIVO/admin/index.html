<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTA6Trucos · Publicar noticia</title><link rel="stylesheet" href="../assets/style.css"><style>body{background:#09090d;color:#fff}.admin{max-width:900px;margin:40px auto;padding:24px}.admin input,.admin textarea{width:100%;box-sizing:border-box;margin:7px 0 18px;padding:12px;border-radius:8px;border:1px solid #444;background:#15151d;color:#fff}.admin textarea{min-height:180px}.admin label{font-weight:700}.admin button{padding:13px 22px;border:0;border-radius:8px;cursor:pointer}.msg{margin-top:15px}</style></head><body><main class="admin"><a href="../es/">← GTA6Trucos</a><h1>Publicar noticia</h1><p>Panel privado. Define <code>NEWS_ADMIN_TOKEN</code> en Vercel antes de usarlo.</p><form id="form"><label>Token privado</label><input id="token" type="password" required><label>Título ES</label><input id="title_es" required><label>Título EN</label><input id="title_en" required><label>Slug ES</label><input id="slug_es" required><label>Slug EN</label><input id="slug_en" required><label>Extracto ES</label><textarea id="excerpt_es"></textarea><label>Extracto EN</label><textarea id="excerpt_en"></textarea><label>Contenido ES (HTML)</label><textarea id="content_es" required></textarea><label>Contenido EN (HTML)</label><textarea id="content_en" required></textarea><label>Imagen (ruta desde /assets/images/)</label><input id="image" placeholder="/assets/images/Nombre.jpg"><label>Categoría</label><input id="category" value="GTA VI"><label>Fuente</label><input id="source_name"><label>URL fuente</label><input id="source_url" type="url"><label>Fecha de publicación</label><input id="published_at" type="datetime-local"><p><label><input id="published" type="checkbox" checked> Publicar inmediatamente</label></p><button type="submit">PUBLICAR</button><div class="msg" id="msg"></div></form></main><script>const $=id=>document.getElementById(id);$('form').addEventListener('submit',async e=>{e.preventDefault();$('msg').textContent='Publicando…';const body={slug_es:$('slug_es').value,slug_en:$('slug_en').value,title_es:$('title_es').value,title_en:$('title_en').value,excerpt_es:$('excerpt_es').value,excerpt_en:$('excerpt_en').value,content_es:$('content_es').value,content_en:$('content_en').value,image:$('image').value,category:$('category').value,source_name:$('source_name').value,source_url:$('source_url').value,published_at:$('published_at').value?new Date($('published_at').value).toISOString():new Date().toISOString(),published:$('published').checked,featured:false};const r=await fetch('../api/news-admin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+$('token').value},body:JSON.stringify(body)});const j=await r.json();$('msg').textContent=r.ok?'Noticia publicada correctamente.':('Error: '+(j.error||'no se pudo publicar'));});</script></body></html>
