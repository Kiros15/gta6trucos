<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="index,follow">

  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2781521462195370"
    crossorigin="anonymous"></script>

  <title>GTA6Trucos · Noticia</title>

  <meta id="desc"
        name="description"
        content="Noticias de GTA VI en GTA6Trucos">

  <link id="canonical"
        rel="canonical"
        href="https://gta6trucos.com/es/noticia/">

  <!-- Rutas absolutas para que funcionen con cualquier slug -->
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>

<body>

<header>
  <a class="logo" href="/es/">
    GTA6<span>TRUCOS</span>
  </a>

  <nav>
    <a href="/es/noticias/">Noticias</a>
    <a href="/es/">Inicio</a>
  </nav>

  <div class="langs">
    <a id="enlink" href="/en/noticias/">🇺🇸 EN</a>
  </div>
</header>

<main class="page article-page">

  <a class="back-link" href="/es/noticias/">
    ← Volver a noticias
  </a>

  <article id="article" class="news-article">
    <p>Cargando noticia…</p>
  </article>

</main>

<footer>
  <strong>GTA6TRUCOS</strong>
  <span>
    © 2026 · Fan site · Rockstar Games is not affiliated with this website.
  </span>
</footer>

<script src="/assets/app.js"></script>

<script>
(async () => {

  const parts = location.pathname
    .split('/')
    .filter(Boolean);

  const slug = decodeURIComponent(
    parts[parts.length - 1] || ''
  );

  try {

    if (!slug || slug === 'noticia') {
      throw new Error('invalid_slug');
    }

    const r = await fetch(
      '/api/news?lang=es&slug=' +
      encodeURIComponent(slug)
    );

    if (!r.ok) {
      throw new Error('api_error');
    }

    const j = await r.json();

    const n = j.news && j.news[0];

    if (!n) {
      throw new Error('news_not_found');
    }

    const safe = s =>
      String(s ?? '').replace(
        /[&<>"']/g,
        m => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[m])
      );

    document.title =
      n.title_es + ' — GTA6Trucos';

    document.getElementById('desc').content =
      n.excerpt_es || '';

    document.getElementById('canonical').href =
      'https://gta6trucos.com/es/noticia/' +
      encodeURIComponent(n.slug_es) +
      '/';

    document.getElementById('enlink').href =
      '/en/noticia/' +
      encodeURIComponent(n.slug_en) +
      '/';

    const image =
      '<img class="article-image" ' +
      'src="' + safe(n.image) + '" ' +
      'alt="' + safe(n.title_es) + '">';

    document.getElementById('article').innerHTML =

      image +

      '<span class="eyebrow">' +
      safe(n.category || 'GTA VI') +
      '</span>' +

      '<h1>' +
      safe(n.title_es) +
      '</h1>' +

      '<p class="article-date">' +
      new Date(n.published_at)
        .toLocaleDateString(
          'es-ES',
          {
            day: 'numeric',
            month: 'long',
            year: 'numeric'
          }
        ) +
      '</p>' +

      (
        n.excerpt_es
          ? '<p class="article-lead">' +
            safe(n.excerpt_es) +
            '</p>'
          : ''
      ) +

      '<div class="ad-container" aria-label="Publicidad">' +
      '<span>Publicidad</span>' +
      '</div>' +

      n.content_es +

      (
        n.source_name
          ? '<p class="source-note">' +
            'Fuente: ' +
            safe(n.source_name) +
            (
              n.source_url
                ? ' · <a href="' +
                  safe(n.source_url) +
                  '" rel="nofollow noopener" ' +
                  'target="_blank">ver fuente</a>'
                : ''
            ) +
            '</p>'
          : ''
      );

  } catch (e) {

    console.error(
      'Error cargando noticia dinámica:',
      e
    );

    document.getElementById('article').innerHTML =
      '<h1>Noticia no encontrada</h1>' +
      '<p>Esta noticia todavía no existe o no está publicada.</p>';

  }

})();
</script>

</body>
</html>
